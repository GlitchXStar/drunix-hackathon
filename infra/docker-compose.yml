services:
  mongodb:
    image: mongo:7.0
    container_name: trustledger-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: trustledger
    volumes:
      - mongo_data:/data/db

  nextcloud:
    image: nextcloud:30-apache
    container_name: trustledger-nextcloud
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: adminpassword
      SQLITE_DATABASE: nextcloud
    volumes:
      - nextcloud_data:/var/www/html

  risk-service:
    build:
      context: ../backend/risk-service
      dockerfile: Dockerfile
    container_name: trustledger-risk-service
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      PORT: "8001"
      INTERNAL_TOKEN: "dev-internal-token-secret"
      DATA_LABEL: "synthetic"

volumes:
  mongo_data:
  nextcloud_data:

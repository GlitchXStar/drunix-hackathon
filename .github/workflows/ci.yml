name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install root & API dependencies
        run: |
          npm install
          cd backend/api && npm install && npx prisma generate

      - name: Run API Tests
        run: |
          cd backend/api && npm test

      - name: Install Risk Service dependencies & test
        run: |
          cd backend/risk-service
          pip install -r requirements.txt
          pytest
